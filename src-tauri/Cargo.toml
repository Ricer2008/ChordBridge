[package]
name = "chordbridge"
version = "0.2.0"
edition = "2021"
description = "吉他谱多维度转换与预览工具"

[lib]
name = "chordbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chordbridge-theory = { path = "theory" }

[workspace]
members = ["theory"]
