name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb appimage"
          - platform: windows-latest
            args: "--bundles nsis msi"
          - platform: macos-latest
            args: ""   # macOS 走 npm run build（含手动 dmg 脚本）

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build (macOS: app + dmg via script)
        if: matrix.platform == 'macos-latest'
        run: npm run build

      - name: Build (Windows / Linux bundles)
        if: matrix.platform != 'macos-latest'
        run: npx tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChordBridge-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/**
            src-tauri/target/release/bundle/appimage/**
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/dmg/**
            src-tauri/target/release/bundle/macos/**
          if-no-files-found: warn
